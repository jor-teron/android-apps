import java.text.SimpleDateFormat

plugins {
    id 'com.android.application'
}

// Release date shown on the About page, stamped at build time (IST), e.g. "6 Oct 2026".
def buildDateIst = { ->
    def fmt = new SimpleDateFormat('d MMM yyyy', Locale.ENGLISH)
    fmt.setTimeZone(TimeZone.getTimeZone('Asia/Kolkata'))
    return fmt.format(new Date())
}

android {
    namespace 'com.jorteron.phonetv'
    compileSdk 34

    defaultConfig {
        applicationId "com.jorteron.phonetv"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "0.2"
        buildConfigField "String", "BUILD_DATE", "\"${buildDateIst()}\""
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
